kind = "mobile"
previewPath = "/mobile/"
title = "Gestão de Autônomos"
description = "Aplicativo mobile para prestadores de serviço autônomos gerenciarem clientes, orçamentos, ordens de serviço e pagamentos. Versão nativa para celular do app web existente, usando a mesma API e identidade visual."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
