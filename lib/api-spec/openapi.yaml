openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for a freelancer/service-provider business management app
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Current user and team membership
  - name: clients
    description: Client registry
  - name: products
    description: Product/service catalog
  - name: quotes
    description: Quote (orçamento) generation
  - name: tasks
    description: Task scheduling and reminders
  - name: dashboard
    description: Dashboard summaries
  - name: company
    description: Company profile used to brand generated quotes
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current authenticated user and their team
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /team:
    get:
      operationId: getTeam
      tags: [account]
      summary: Get the current user's team and its members
      responses:
        "200":
          description: Team with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "404":
          description: User has no team yet

  /team/create:
    post:
      operationId: createTeam
      tags: [account]
      summary: Create a new team and become its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"

  /team/join:
    post:
      operationId: joinTeam
      tags: [account]
      summary: Join an existing team using an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamJoinInput"
      responses:
        "200":
          description: Joined team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "404":
          description: Invite code not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary with pending quotes and upcoming tasks
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients for the current team
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client with quote/task history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Client deleted
        "404":
          description: Client not found

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products/services for the current team
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product/service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product/service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product/service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes for the current team
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/QuoteStatus"
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote with line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote (fields, status, and/or replace line items)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Quote updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Quote deleted
        "404":
          description: Quote not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for the current team
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (including marking it done)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found

  /notifications:
    get:
      operationId: getNotifications
      tags: [tasks]
      summary: Get overdue and due-soon tasks as reminder notifications
      responses:
        "200":
          description: Notification buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"

  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get the current team's company profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: User has no team yet
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update the current team's company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Company profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: User has no team yet

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Me:
      type: object
      required: [id, email, name, teamId, teamName, role]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        teamId:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]

    TeamMember:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string

    TeamWithMembers:
      type: object
      required: [id, name, inviteCode, createdAt, members]
      properties:
        id:
          type: string
        name:
          type: string
        inviteCode:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamJoinInput:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
          minLength: 1

    Client:
      type: object
      required: [id, name, phone, email, notes, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClientDetail:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [quotes, tasks]
          properties:
            quotes:
              type: array
              items:
                $ref: "#/components/schemas/Quote"
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/Task"

    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Product:
      type: object
      required: [id, name, description, price, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        price:
          type: number
          minimum: 0

    QuoteStatus:
      type: string
      enum: [draft, sent, approved, rejected]

    QuoteItem:
      type: object
      required: [id, productId, description, quantity, unitPrice, total]
      properties:
        id:
          type: integer
        productId:
          type: ["integer", "null"]
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        total:
          type: number

    QuoteItemInput:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        productId:
          type: ["integer", "null"]
        description:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 0
        unitPrice:
          type: number
          minimum: 0

    Quote:
      type: object
      required:
        [
          id,
          clientId,
          clientName,
          status,
          serviceDescription,
          notes,
          total,
          items,
          createdAt,
          updatedAt,
          sentAt,
        ]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        status:
          $ref: "#/components/schemas/QuoteStatus"
        serviceDescription:
          type: ["string", "null"]
          description: Description of the service/work to be performed, shown on the printable quote.
        notes:
          type: ["string", "null"]
        total:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: ["string", "null"]
          format: date-time

    QuoteInput:
      type: object
      required: [clientId, items]
      properties:
        clientId:
          type: integer
        status:
          $ref: "#/components/schemas/QuoteStatus"
        serviceDescription:
          type: string
        notes:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuoteItemInput"

    QuoteUpdate:
      type: object
      properties:
        clientId:
          type: integer
        status:
          $ref: "#/components/schemas/QuoteStatus"
        serviceDescription:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItemInput"

    TaskStatus:
      type: string
      enum: [pending, done]

    Task:
      type: object
      required:
        [
          id,
          title,
          description,
          dueAt,
          status,
          clientId,
          clientName,
          createdAt,
        ]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        dueAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TaskStatus"
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [title, dueAt]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        dueAt:
          type: string
          format: date-time
        clientId:
          type: ["integer", "null"]

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        dueAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TaskStatus"
        clientId:
          type: ["integer", "null"]

    DashboardSummary:
      type: object
      required:
        [
          pendingQuotesCount,
          pendingQuotesTotal,
          totalClients,
          totalProducts,
          upcomingTasks,
          recentQuotes,
        ]
      properties:
        pendingQuotesCount:
          type: integer
        pendingQuotesTotal:
          type: number
        totalClients:
          type: integer
        totalProducts:
          type: integer
        upcomingTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        recentQuotes:
          type: array
          items:
            $ref: "#/components/schemas/Quote"

    NotificationsResponse:
      type: object
      required: [overdueTasks, dueSoonTasks]
      properties:
        overdueTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        dueSoonTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    Company:
      type: object
      required: [id, name, logoUrl, phone, email, address, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        logoUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
