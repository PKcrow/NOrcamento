    Quote:
      type: object
      required:
        [
          id,
          clientId,
          clientName,
          status,
           serviceScopeEnabled,
          serviceDescription,
          notes,
          laborCost,
          total,
          items,
          createdAt,
          updatedAt,
          sentAt,
          publicToken,
          publicLinkExpiresAt,
          publicLinkRevokedAt,
          clientResponseNote,
          respondedAt,
          convertedTaskId,
        ]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        status:
          $ref: "#/components/schemas/QuoteStatus"
        serviceScopeEnabled:
          type: boolean
          description: Whether the service scope section should appear on the quote.
        serviceDescription:
          type: ["string", "null"]
          description: Description of the service/work to be performed, shown on the printable quote.
        notes:
          type: ["string", "null"]
        laborCost:
          type: number
          minimum: 0
          description: Cost of labor/mão de obra, added on top of the item totals.
        total:
          type: number
          description: Sum of all item totals plus laborCost.
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: ["string", "null"]
          format: date-time
        publicToken:
          type: ["string", "null"]
          description: Token used to build the public approval link. Null until shared.
        publicLinkExpiresAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp at which the public link becomes invalid.
        publicLinkRevokedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp at which an owner revoked the public link.
        clientResponseNote:
          type: ["string", "null"]
          description: Note left by the client when approving/rejecting via the public link.
        respondedAt:
          type: ["string", "null"]
          format: date-time
        convertedTaskId:
          type: ["integer", "null"]
          description: Task created from this quote, if any.

