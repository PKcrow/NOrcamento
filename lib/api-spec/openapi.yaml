openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for a freelancer/service-provider business management app
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Current user and team membership
  - name: clients
    description: Client registry
  - name: products
    description: Product/service catalog
  - name: service-templates
    description: Reusable quote service templates
  - name: quotes
    description: Quote (orçamento) generation
  - name: tasks
    description: Task scheduling and reminders
  - name: dashboard
    description: Dashboard summaries
  - name: company
    description: Company profile used to brand generated quotes
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current authenticated user and their team
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /team:
    get:
      operationId: getTeam
      tags: [account]
      summary: Get the current user's active team and its members
      responses:
        "200":
          description: Team with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "404":
          description: User has no team yet

  /team/list:
    get:
      operationId: listTeams
      tags: [account]
      summary: List all teams the current user belongs to
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamSummary"

  /team/create:
    post:
      operationId: createTeam
      tags: [account]
      summary: Create a new team and become its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"

  /team/join:
    post:
      operationId: joinTeam
      tags: [account]
      summary: Join an existing team using an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamJoinInput"
      responses:
        "200":
          description: Joined team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "400":
          description: Invite code not found
        "409":
          description: Already a member of this team

  /team/switch:
    post:
      operationId: switchTeam
      tags: [account]
      summary: Switch the active team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSwitchInput"
      responses:
        "200":
          description: Active team switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "403":
          description: Not a member of this team

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary with pending quotes and upcoming tasks
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients for the current team
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client with quote/task history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Client deleted
        "404":
          description: Client not found

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products/services for the current team
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product/service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product/service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product/service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found

  /service-templates:
    get:
      operationId: listServiceTemplates
      tags: [service-templates]
      summary: List reusable service templates for the current team
      responses:
        "200":
          description: Service templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceTemplate"
    post:
      operationId: createServiceTemplate
      tags: [service-templates]
      summary: Create a reusable service template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTemplateInput"
      responses:
        "201":
          description: Service template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTemplate"

  /service-templates/{id}:
    get:
      operationId: getServiceTemplate
      tags: [service-templates]
      summary: Get a service template with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTemplate"
        "404":
          description: Service template not found
    patch:
      operationId: updateServiceTemplate
      tags: [service-templates]
      summary: Update a reusable service template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTemplateUpdate"
      responses:
        "200":
          description: Service template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTemplate"
        "404":
          description: Service template not found
    delete:
      operationId: deleteServiceTemplate
      tags: [service-templates]
      summary: Delete a reusable service template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Service template deleted
        "404":
          description: Service template not found

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes for the current team
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/QuoteStatus"
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote with line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote (fields, status, and/or replace line items)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Quote updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Quote deleted
        "404":
          description: Quote not found

  /quotes/{id}/share:
    post:
      operationId: shareQuote
      tags: [quotes]
      summary: Generate (or reuse) a public approval token for a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote with public token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found

  /quotes/{id}/revoke-link:
    post:
      operationId: revokeQuotePublicLink
      tags: [quotes]
      summary: Revoke the public approval link for a quote (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote with revoked public link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "403":
          description: Owner access required
        "404":
          description: Quote not found

  /quotes/{id}/convert-to-task:
    post:
      operationId: convertQuoteToTask
      tags: [quotes]
      summary: Schedule one task from an approved quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteTaskScheduleInput"
      responses:
        "200":
          description: Task already linked to this quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "201":
          description: Task created and linked to the quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Quote not found
        "409":
          description: Quote is not approved or the schedule conflicts

  /public/quotes/{token}:
    get:
      operationId: getPublicQuote
      tags: [quotes]
      summary: Get a quote by its public token (no authentication)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public quote view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuote"
        "404":
          description: Quote not found

  /public/quotes/{token}/respond:
    post:
      operationId: respondPublicQuote
      tags: [quotes]
      summary: Approve or reject a quote via its public token (no authentication)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicQuoteResponseInput"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuote"
        "404":
          description: Quote not found
        "409":
          description: Quote already answered

  /reports/monthly:
    get:
      operationId: getMonthlyReport
      tags: [dashboard]
      summary: Monthly financial report for the current team
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"

  /team/members/{userId}:
    patch:
      operationId: updateTeamMemberRole
      tags: [account]
      summary: Change a member's role in the active team (owner only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberRoleInput"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "403":
          description: Not allowed
        "404":
          description: Member not found
    delete:
      operationId: removeTeamMember
      tags: [account]
      summary: Remove a member from the active team (owner only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "403":
          description: Not allowed
        "404":
          description: Member not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for the current team
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (including marking it done)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found

  /tasks/{id}/photos:
    post:
      operationId: addTaskPhoto
      tags: [tasks]
      summary: Attach an uploaded photo to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPhotoInput"
      responses:
        "201":
          description: Photo attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPhoto"
        "404":
          description: Task not found

  /tasks/{id}/photos/{photoId}:
    delete:
      operationId: deleteTaskPhoto
      tags: [tasks]
      summary: Remove a photo from a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Photo deleted
        "404":
          description: Task or photo not found

  /notifications:
    get:
      operationId: getNotifications
      tags: [tasks]
      summary: Get task reminders and recent quote responses as notifications
      responses:
        "200":
          description: Notification buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [tasks]
      summary: Register an Expo push token for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegistration"
      responses:
        "204":
          description: Push token registered
    delete:
      operationId: unregisterPushToken
      tags: [tasks]
      summary: Remove an Expo push token for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenUnregister"
      responses:
        "204":
          description: Push token removed

  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get the current team's company profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: User has no team yet
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update the current team's company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Company profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: User has no team yet

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Me:
      type: object
      required: [id, email, name, teamId, teamName, role, teams]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        teamId:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamSummary"

    TeamSummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string

    TeamSwitchInput:
      type: object
      required: [teamId]
      properties:
        teamId:
          type: string
          minLength: 1

    TeamMember:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string

    TeamWithMembers:
      type: object
